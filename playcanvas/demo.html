<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinekt360 — Psychedelic Particles</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05010f; }
    #c { width: 100%; height: 100%; display: block; }
    #hint {
      position: fixed; left: 16px; bottom: 14px; z-index: 5;
      font: 12px/1.5 -apple-system, Helvetica, Arial, sans-serif;
      color: rgba(255, 255, 255, 0.55); letter-spacing: 0.04em;
      pointer-events: none; user-select: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.23.3/build/playcanvas.mjs"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">Kinekt360 · demo fallback · click for microphone audio</div>

  <script type="module">
    import * as pc from 'playcanvas';
    import { PsyScene } from './psyScene.mjs';

    const canvas = document.getElementById('c');
    const app = new pc.Application(canvas, {});
    window.app = app;
    app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
    app.setCanvasResolution(pc.RESOLUTION_AUTO);
    app.start();

    const camera = new pc.Entity('MainCamera');
    camera.addComponent('camera', {
      clearColor: new pc.Color(0.008, 0.003, 0.028, 1),
      fov: 55,
      nearClip: 0.1,
      farClip: 300
    });
    camera.setPosition(0, 7.5, 19);
    camera.lookAt(new pc.Vec3(0, 0.0, 0));
    app.root.addChild(camera);

    const controller = new pc.Entity('Controller');
    controller.addComponent('script');
    app.root.addChild(controller);

    app.scripts.add(PsyScene);
    controller.script.create(PsyScene);
  </script>
</body>
</html>
